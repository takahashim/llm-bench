source: facts_coarse/08.yaml
thesis: "Railsで型チェックを通そうとすると回避策だらけになるが、それは厳密な型の道具だと思うからで、開発者テストのように不完全でも役に立つしくみとして、使う人が手を入れながら育てていくものと捉えた方がよい。"
kind: record

moves:
  - q: "これは何の記録で、どこまでが書かれているのか"
    uses: [p1]

  - q: "Railsアプリで最初にぶつかるのはどこか"
    uses: [p5, p8]

  - q: "なぜクラスメソッドが見つからないと言われるのか"
    uses: [p6, p7]

  - q: "出てきたエラーを実際どう書いて切り抜けたのか"
    uses: [p22, p4]

  - q: "検証まわり以外でも詰まるのか"
    uses: [p3, p9]

  - q: "足りない型定義は、誰がどこに書くものなのか"
    uses: [p13, p12]

  - q: "gemの作者ではない人は、どこまで書けばよいのか"
    uses: [p14, p15]

  - q: "この状態のまま実務に乗せるには何が足りないのか"
    uses: [p10, p20, p21]

  - q: "それでも得はあったのか。結局これをどういうものと見ればよいのか"
    uses: [p19, p18]

rules:
  - "says（一文要約）は置かない。各手は要点をこの順でこう並べることだけを決める。"
  - "本文では各要点の細部（何で詰まったか、どう回避したか、何が残っているか）をそのまま書く。"
  - "p22 は kind: code なので [コード] 1行と前後の説明にする。"
  - "thesis は最後の手（p18）に置く。"
