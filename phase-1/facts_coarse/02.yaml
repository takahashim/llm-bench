source: texts/eval/02.md
title: "Rubyのアンチパターン: privateメソッドばかり増やしてしまう"
reader: "メソッド分割やアクセス制御の指針に従ってコードを整理しているが、クラスが膨らんで困っているRuby開発者"
points:
  - id: p8
    claim: "同じクラスに置かれている限り、非公開のメソッドは互いにも公開側からも制限なく呼び合えるので、ややこしい処理がそこに溜まっていく。アクセス制御の仕組み上、これを止める手立てはない。"
    kind: fact

  - id: p3
    claim: "行数とメソッド数がふくれる、非公開のものが公開のものより圧倒的に多い、ひとつひとつの大きさや中身がそろっていない、名前の似たものが連なる——そんな見た目になる。"
    kind: example

  - id: p14
    claim: "挙げた例ではdataとparsed_dataが別の値なので、それぞれの中身に踏み込むメソッドは互いに縁が薄く、同じクラスに置く理由がない。"
    kind: fact

  - id: p1
    claim: "メソッドを細かく割る・公開範囲を絞るという助言をそのまま実行し続けると、分割自体は進んでいるのに手に負えない状態へ向かってしまう。"
    kind: fact

  - id: p11
    claim: "レポート生成クラスで公開メソッドを1つだけ残し他を非公開にした例と、整形役と解析役の2クラスへメソッドを振り分けた例、さらに抽出先を内側に入れ子にした例が並べられている。"
    kind: code

  - id: p6
    claim: "よく似た処理を他の場所でも使いたくなったときに丸ごと写すしかなくなり、同じクラスの中でも似通ったコードが繰り返される。"
    kind: fact

  - id: p16
    claim: "近い種類のまずい設計として、神クラスが挙げられている。"
    kind: fact

  - id: p9
    claim: "手を入れるべき本当の対象は、それらが1つのクラスに同居していることだと著者は捉えている。"
    kind: opinion

  - id: p5
    claim: "内部の処理を外から呼ぶ入口がないため、無理に非公開のものを叩くか、粒度の粗いまとめてのテストで間に合わせることになる。"
    kind: fact

  - id: p15
    claim: "扱う値ごとにメソッドを仕分けし、それに対応するクラスを切り出すのはよい習慣で、オブジェクト指向という枠を外して言うなら、役割に見合ったデータの持ち方を用意しようという話にもなる。"
    kind: opinion

  - id: p2
    claim: "ひとつのメソッドが巨大なクラスよりはましだとしても、その段階で落ち着いてはいけない。"
    kind: opinion

  - id: p12
    claim: "整理し終えてみると、元のクラスには非公開のメソッドが要らなかったという結論になることもある。"
    kind: opinion

  - id: p7
    claim: "ある箇所に手を入れたとき、波及する先がどこまでなのか見通せなくなる。"
    kind: fact

  - id: p10
    claim: "役目の近いものを束ねて別のクラスへ移してしまえば、元のクラスからそのメソッドが消えるので、公開したくないものを抱えているという悩み自体がなくなる。"
    kind: opinion

  - id: p4
    claim: "ひとつのクラスに毛色の違う役目が同居するため、どのメソッドがどれに頼っているのか見えなくなる。"
    kind: fact

  - id: p13
    claim: "解析後の値が込み入ってきたなら、それ専用のクラスを立てることも視野に入れてよい。"
    kind: opinion
    scope: "解析後のデータが大きくなってきた場合"
