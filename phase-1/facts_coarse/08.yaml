source: texts/eval/08.md
title: "RailsアプリにRBSとSteepを入れて詰まった点"
reader: "Railsアプリで型チェックを試そうとしているRuby開発者"
points:
  - id: p13
    claim: "gem_rbs_collectionは各gemの型定義を持ち寄るためのリポジトリで、gemの型定義を共有する道は、gem自身の中に同梱する形と、このリポジトリに足す形の2つがある。前者はそのgemの作者が書き、後者は主に作者以外の利用者が書くことになる。"
    kind: fact

  - id: p3
    claim: "Steepfileでbigdecimalのライブラリを指定してもto_dが通らず、手元の型定義ファイルに自分で宣言を足して切り抜けた。標準ライブラリ向けのテストの書き方が分からず一度は諦めたが、後に教わって書けるようになりpull requestも出した。"
    kind: fact

  - id: p9
    claim: "Struct.newの戻り値を定数へ入れる素直な書き方は代入の型が合わないと怒られ、間に特別な記号を挟んだ形にする必要がある。これは不自然で見た目にも分かりにくく、むしろ型チェックを抑えるコメントが使える方がましに思える（慣れの問題もあるかもしれない）。"
    kind: opinion

  - id: p18
    claim: "型定義を書く感覚は、RSpecのテストに近いものがある。Rubyで型安全に近い世界が早く来るとは思えずそこに力を注ぐのも違う気がするので、厳密な型やその代わりの何かを求めるのではなく、開発を進めるための道具や仕組みと見た方がよいかもしれない。完全なテストが現実的でなくても開発者テストが役に立つのと同じように、gemの作者と型定義の提供者とアプリ開発者が協力して育てる仕組みと考えてもよいのではないか。"
    kind: opinion

  - id: p5
    claim: "ActiveModelの検証機能をincludeしたクラスでvalidatesを書くとメソッドが無いと言われてしまい、クラスメソッドとして使えることを型定義ファイルに明記して回避した。ActiveModel::Modelをincludeした場合も同様。"
    kind: fact

  - id: p20
    claim: "TypeScriptの型ガードに当たるものがまだ無いので、要らない検知が増えて使い勝手が落ちそう。コメントでの抑制があれば多少は補えるが限界もある。かといってRubyのコードに型ガードめいた記述が溢れるのも嬉しくなく、そこへ届いてからが型との付き合い方の本格的な議論になりそう。"
    kind: opinion

  - id: p1
    claim: "Railsアプリへ型チェックを持ち込もうと試行錯誤した記録で、同じところで引っかかる人がいるだろうと、困った点と抜け道をまとめている。RBSやSteepそのものの説明は省いており、不明な人は他の解説記事を参照するよう案内している。"
    kind: fact

  - id: p14
    claim: "gemの作者ではない人が書くなら、privateまで網羅する必要はなく、外から見えるAPIのうち、公布済みインターフェイス（Martin Fowlerの言うpublished interface）と見なせるものだけでよさそう。外部の人が非公開メソッドの仕様を決めるのも筋が通らない。実際、寄贈の手引きにも重要な部分やREADMEやドキュメントに出てくる例、自分のアプリが使うAPIに集中せよと書かれている。開発中のアプリ自身の型定義ディレクトリに置くものは、また別の指針を立てて考えるのがよさそう。"
    kind: opinion

  - id: p7
    claim: "includeした先で特異メソッドがクラス側のものとして扱われるような構文が型定義側にあれば幸せになれるかもしれない、という思いつきを書いている。"
    kind: opinion

  - id: p12
    claim: "I18nの翻訳メソッドやTime.zone.now.yesterdayが弾かれる件は、それぞれgem_rbs_collectionへpull requestを出した。他にもいくつか投げている。"
    kind: fact

  - id: p10
    claim: "実務に乗せるうえで何より大事なのは、チェックする範囲を部分的に、しかも柔軟に決められること。RuboCop風にコメントで範囲を指定して外せるとよく、1ファイルだけ試す場合にSteepfileを毎回書き換えるのも面倒なので、コマンドラインの引数で対象を指定できると作業が楽になりそう。"
    kind: opinion

  - id: p4
    claim: "既にあるクラスへメソッドを足す類のものは、こうして必要に応じて1つずつ宣言を足していく形になりそう。少々泥臭いが、アプリ内のどこからでも呼ぶメソッドなので、分かりやすさはある。"
    kind: opinion

  - id: p19
    claim: "今の時点でもnilの扱いが甘い箇所はそれなりに見つかるようで、これは助かる点かもしれない。"
    kind: opinion

  - id: p6
    claim: "元をたどれば、Railsがクラスメソッドをモジュール内の入れ子モジュールで定義する手法を使っているのが原因。Rubyの実行時の意味で初めて成り立つ仕掛けなので、同じ構造を型定義の側へ移してもクラス側の宣言としては読まれないのは当然のこと。"
    kind: fact

  - id: p15
    claim: "ただしモジュールの非公開メソッドは、includeした先のクラスから使う前提で作られていることもあるので、そこの線引きは難しいかもしれない。"
    kind: opinion

  - id: p8
    claim: "検証の条件にブロックを渡して中でレコードの状態を見るような書き方をすると、クラスメソッド側を探しに行ってメソッドが無いと言われる。本当はインスタンス側のものなので、この手のブロックの中はインスタンスのレベルで解釈してほしい。"
    kind: opinion

  - id: p22
    claim: "回避策として、既にあるクラスへメソッドを足す宣言、検証用のものをクラス側から呼べると明示する宣言、そして条件ブロックの検査を外すコメントの書き方が、出てくるエラーの表示と並べて示されている。"
    kind: code

  - id: p21
    claim: "Railsでよく使われるgemでも型定義が揃っていないものがあり、正しいメソッドが誤って弾かれることも残っている。みんなが触れば気づく類なのでそう遠くないうちに改善するはずだが、その時間を縮めるには参加する人と協力する人を増やすしかない。"
    kind: opinion
