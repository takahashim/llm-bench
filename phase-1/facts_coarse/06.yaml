source: texts/eval/06.md
title: "『Sustainable Web Development with Ruby on Rails』を読んだ感想"
reader: "Railsアプリの設計方針やサービス層の扱いに悩んでいる開発者"
thesis: "この本の読みどころは個々の技法ではなく、流行りの設計論を避けて理解しやすさと変更しやすさを優先する著者の一貫した構えにある。全部を真似る必要はなく、仲間と設計を論じ合う材料として読むのがよい。"
points:
  - id: p9
    claim: "著者はクリーンアーキテクチャやSOLIDに与しないことをはっきり示し、オブジェクト指向らしさ、エレガントさ、再利用、デザインパターン、メトリクスといった言葉で何度も痛い目を見たと打ち明けたうえで、読みやすさと直しやすさを代わりに掲げる。極端な教条には走らず、どれも引き換えの関係だと繰り返す。"
    kind: fact

  - id: p2
    claim: "全体は導入、Railsの各部分の使い方を細かく論じる本編、そしてRails本体から離れた話（認証と認可、API、CI、監視やログといった運用）の3部に分かれている。"
    kind: example

  - id: p14
    claim: "サービスクラスの作法も細かい。クラスメソッドではなくインスタンスを作ってから呼ぶ、callのように何にでも使える名前は付けない、外から全部注入するのではなく必要ならメソッド内で作る、戻り値はそのサービス専用の結果クラスで包む、といった具合。どれについてもなぜそうするのかをその場で具体的に述べているので、読者は納得できるかどうかで取り入れるかを決められる。"
    kind: example

  - id: p5
    claim: "Railsの良さは目一杯認めて寄り添うが、全面的に従うのではなく取るものと捨てるものを選び、格好いい手法や新しい手法ではなく年季の入ったやり方を選んでいる。"
    kind: fact

  - id: p18
    claim: "著者はStitch Fixでプログラマからアーキテクトまで務めた後に別のスタートアップでCTOを務めている。『Agile Web Development with Rails 6』の共著者であり、Brutalist Web Designのサイトの主でもある。Javaから入ったキャリアが、この年季の入った感じの出どころかもしれない。"
    kind: fact

  - id: p7
    claim: "ドメインのロジックはActiveRecordやActiveModelには書かず、サービスクラスとそれを置く層に移す。コントローラやジョブ、メーラからActiveRecordに直接触らないのが原則。"
    kind: fact

  - id: p11
    claim: "ドメインのロジックの層がデータアクセスの層に依存する向きになっていて、クリーンアーキテクチャとは逆、見方を変えればPofEAAの頃へ引き返したような印象。Rubyは融通が利くのでそこまで依存の注入に凝らなくてよい、というのは分かる気もする。"
    kind: opinion

  - id: p4
    claim: "$49.95を高いと感じる人は国別の価格設定の案内を読むとよく、米国以外からの購入には割引のクーポンコードがある。amazon.co.jpにも日本向け価格で並んでいるが、PDFとEPUBとMarkdownが手に入る公式サイトで買うのを勧めたい気もする。"
    kind: opinion

  - id: p1
    claim: "Railsの設計で頭を抱えた経験のある人なら、うなずいたり反発したりしながら楽しめる本で、Web開発を長く生き延びてきた人が語る定石、という手触りがある。"
    kind: opinion

  - id: p12
    claim: "モデルから業務のロジックを引き剥がす理由は、業務のロジックは複雑で変わりやすく、そういうものが各所から頼られるとバグが重くなりシステムが揺らぐ一方、ActiveRecordのモデルは各所から参照されるのを避けられない、という筋で説明される。"
    kind: fact

  - id: p20
    claim: "本の内容を一人で抱えて大改造に走るより、同じチームの人やRails使いの知り合いと読みながら、設計をどうすべきか・なぜそうするのかを話し合うのが一番いい使い方かもしれない。全部に同意できる読者はそう多くないはずで、評者自身はマイグレーションをSQLで書くことには賛同していない。"
    kind: opinion

  - id: p3
    claim: "ここで言う持続可能性は、仕様や使えるリソースが増減したり入れ替わったりしても、チームの顔ぶれが変わっても開発を続けられること。規模や速さの話ではないのでスケーラブルという語は避けたらしい。"
    kind: fact

  - id: p17
    claim: "細かい方針としては、例にOpenStructをよく使う、CSSはデザインシステムを前提にOOCSSかユーティリティ系を選ぶ、ログはLogrageで1行にまとめる、テストにはMinitestとFactoryBotを使う、テンプレートはERB、Rakeタスクを1つずつ別ファイルに置く、といったものが並ぶ。"
    kind: example

  - id: p6
    claim: "レールから外れる箇所の例としては、データの整合性はActiveRecordの検証ではなくDBの制約で担保する、マイグレーションをRubyでなくSQLで書く、ActiveJobを介さずジョブのライブラリを直に使う、コールバックやHelperは用途を絞る、などがある。"
    kind: example

  - id: p15
    claim: "この結果クラスは汎用のResult型のようなものを想像すると全然違い、現場で練られた知恵という感じで面白い。"
    kind: opinion

  - id: p13
    claim: "あるべきアーキテクチャを突き詰めるのではなく、目の前の課題を片付けつつシステムを無事に育て、開発を続けられることに重きを置いている。"
    kind: fact

  - id: p8
    claim: "一方でassociationは書き、画面向けと割り切った検証も普通に書くので、ActiveRecordは使い勝手のよいデータアクセスの層として残り、共通化したいクエリもそこに書かれる。"
    kind: fact

  - id: p21
    claim: "この本の言うサービスクラスは結局ただのRubyのクラスで、それを置く場所をサービス層と呼んでいるだけ。Rails標準のクラスだけで粘らず業務のロジックを分けてテストも書こう、共通の親クラスを無理に作らなくてよい、という穏やかな話なので身構えなくてよい。ただし自由度が高く、自分たちで規則を作らないと統制が取れないのが難しいところ。"
    kind: opinion
