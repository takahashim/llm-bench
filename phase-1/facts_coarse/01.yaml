source: texts/eval/01.md
title: "Rubyのアンチパターン: Hashで何でも表現してしまう"
reader: "Rubyでアプリケーションを書いていて、データの持ち方・設計に迷っている開発者"
thesis: "データのまとまりをHashで持ち回す癖は、中身が読めず書き換えも追えないコードを招く。使い捨てでよいからクラスやStructを起こし、値の側まで型にしておく方が後々楽になる。"
points:
  - id: p7
    claim: "まずは素直に専用のクラスを定義して使うのが望ましい。"
    kind: opinion

  - id: p3
    claim: "中心的な困りごとは、コードを読み解くのも手を入れるのも重くなること。"
    kind: fact

  - id: p11
    claim: "Structを生成するときは、キーワードで初期化する指定（keyword_init）を使うかどうかも検討に値する。"
    kind: opinion
    scope: "Structを選んだ場合"

  - id: p1
    claim: "何でもHashで片付けようとすると、得られる手軽さよりも副作用の方が大きくなる。"
    kind: opinion

  - id: p14
    claim: "JSONを相手にする処理ではHashを含むオブジェクトを避けきれないが、それでも生のまま持ち回らず、JSONを包むクラスを用意してそのメソッド経由で触る形にした方が楽になる。"
    kind: opinion
    scope: "JSONを入出力する場面"

  - id: p5
    claim: "既定で書き換え可能なため、どこで内容が変わるのかを追えず影響範囲が見えなくなる。凍結したとしても、作り直しては渡し歩く構造のままなら挙動の把握は楽にならない。"
    kind: fact

  - id: p9
    claim: "育ちすぎて複雑になったクラスでも、同じだけ膨らんだHashよりは手に負える。"
    kind: opinion

  - id: p2
    claim: "依存しすぎのサインとして、よく似た別物のHashが各所を巡っている、インスタンス変数をほとんど持たずメソッドの引数のHashに情報を詰めている、1つのHashでキーの型が混ざっている、やり取りに使うJSONを加工せず内部処理でも使っている、といった状態がある。"
    kind: example

  - id: p12
    claim: "入れ物だけでなく中に入れる値の側もきちんと型にする（Structでも自作の型でもよい）のが肝心で、共通の親やモジュールを共有していなくても、中身の見当がつかないHashより扱いやすい。"
    kind: opinion

  - id: p4
    claim: "キーの名前は覗けば分かっても、値の形が揃っていないと何を保持しているのか読み取れない。さらにキーを文字列とシンボルのどちらにするか、両方受け付けるかで方針がぶれがちになる。"
    kind: fact
    scope: "キーの揺れはRuby特有の事情"

  - id: p8
    claim: "Hashを書くのと同程度の軽さで、その場しのぎの小さなクラスを作ってよい。最初は同じファイルの中だけで通用するもので十分で、他からも呼びたくなった時点で別ファイルへ移せばよい。"
    kind: opinion

  - id: p15
    claim: "何でも詰め込むユーティリティクラスも、これと近い種類のまずい設計として挙げられる。"
    kind: fact

  - id: p6
    claim: "クラスがあれば新しい処理を「その型かその周辺に足す」と置き場所を決められるが、Hashには判断の起点となる型がないので処理がどこにでも散ってしまう。"
    kind: fact

  - id: p10
    claim: "クラスを起こすほどでもないと感じるならStructで代用でき、ブロック内にメソッドを書けるので実質的には読み書き用のメソッドが付いたクラスと変わらない。"
    kind: opinion

  - id: p13
    claim: "RBSのunion typeやinterfaceの宣言で型をはっきり書く将来に向けた準備としても、どんな型を用意すべきかを考えておくのは無駄にならない。"
    kind: opinion
