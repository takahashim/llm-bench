source: texts/eval/09.md
title: "DHHの新しいデプロイツールMRSKを試してみた"
reader: "安いサーバでコンテナを動かしたい、サーバ運用の知識がある開発者"
thesis: "MRSKは37Signalsの脱クラウドから生まれた道具だが、効くのはむしろ安いサーバでコンテナを動かしたい人の方だ。完成度はまだ低く、それを面白がれる人向けではある。"
points:
  - id: p11
    claim: "ヘルスチェック用に200を返す実装、素朴なDockerfile、mrsk initで作られる設定ファイルの中身、そして環境変数を書く.envの例が示されている。Dockerfileはもう少し作り込めば容量を減らせて嬉しそうではある。"
    kind: code

  - id: p2
    claim: "月5ドル程度の素のインスタンスをHerokuのように使えるようになる。なおDBやS3やRedisは自分で手当てする前提で、別インスタンスとして立ち上げる仕掛けも備えている。"
    kind: fact

  - id: p16
    claim: "稼働中のコンテナの状況を見る、Railsのコマンドやコンソールを実行する、コンテナ内のシェルに入る、ログを見る、停止と再開、全コンテナを消して初期状態に戻す、といったコマンドが揃っていてHerokuやCapistranoに似た雰囲気。設定情報を表示するコマンドは秘密の値をそのまま出してびっくりするが、さすがにissueは立っていた。"
    kind: example

  - id: p4
    claim: "背景は37Signalsがクラウドから引き揚げていることで、負荷が安定しているなら自前の機材の方が安く済むという判断らしい。とはいえ自前の機材には運用の基盤が要り、以前使っていたKubernetesを自分たちで回すのも重いので、簡単なものを自作した方が早いという発想から生まれた。"
    kind: fact

  - id: p1
    claim: "MRSKはDHHが2023年1月に作り始めた、コンテナ向けのCapistranoとでも言うようなデプロイツール。いかにもDHHらしく、クラウドネイティブな今の目線からすると中身はむしろ懐かしい感じがする。"
    kind: opinion

  - id: p14
    claim: "deployコマンドでデプロイでき、2回目以降はredeployの方が速い。root以外のユーザーを使う場合は設定ファイルの変更に加えて、サーバ側へログインしての下準備が必要になる。"
    kind: fact

  - id: p6
    claim: "世の中の需要としては、クラウドから撤退するより、実験や学習、個人の開発のために安くて控えめなサーバの上で動かしたいという方が大きそう。そこでコンテナを使おうとするとAWSなどで費用をかけて組むか、面倒を隠してくれる便利なサービスに乗るかになり、あれが無いこれが高いという話になりがちだった。サーバまわりに慣れた人が格安のコンテナ環境を手軽に回す道具として期待できる。"
    kind: opinion

  - id: p9
    claim: "既定ではrootのまま直接sshで入る大胆な作りだが、別のアカウントでも手間をかければ使える。"
    kind: fact

  - id: p19
    claim: "格安のサーバで実験する場合、DBの用意が一番やっかい。DHHはSQLiteを推しているようなので、Litestreamのようなものに頼る方が賢い解き方なのかもしれない。"
    kind: opinion

  - id: p3
    claim: "37Signalsは本番で使っているようだが粗削りな段階で、当面は共同開発に加わるくらいの気構えのある人に向く。"
    kind: opinion

  - id: p8
    claim: "試すのに必要なのはsshで入れるLinuxサーバ（推奨されるのはUbuntuかDebian）、イメージの置き場になるDocker Hubなどのアカウント、そしてアプリ用のDockerfile。サーバはAWSでもAzureでもDigitalOceanでもLinodeでもベアメタルでもよく、国内ではWebARENA Indigoが月額349円で最も安そうで、そこでも動いた。"
    kind: example

  - id: p15
    claim: "裏で動いているのはログを見れば分かる通りで、buildxでローカルにイメージを作ってレジストリへ上げ、サーバ側がそれを取得して走らせる流れ。手元のmacOS、手元のコンテナ、サーバ側のコンテナでCPUの系統が入り混じっていても面倒を見てくれるし、ビルド環境の指定もできる。"
    kind: fact

  - id: p5
    claim: "移転の経緯はDHHのブログよりも、作業に協力したDeft社の事例記事の方が読みやすいかもしれない。価格は別としても自力でのオンプレ運用は大変そうで現実味を感じにくかったが、こういう相手と組めるなら成り立つのかもと思った。"
    kind: opinion

  - id: p10
    claim: "前提として置かれているのはRailsだが、他でも動きそう。アプリ側はヘルスチェックに応える必要があり、Rails 7.1なら最初から用意されるようだが、それ以外では決まったパスで200を返す機能を自分で入れておく。"
    kind: fact

  - id: p13
    claim: "初期化コマンドでconfig/deploy.ymlが作られ、設定はこの1ファイルに集まる。大文字で書かれた値は環境変数から読まれ、.envに書いておけばそれが使われる。秘匿情報は1passwordのようなサービスに預けて.envを生成することもできるが、今のところERBでテンプレートをごりごり書く形。"
    kind: fact

  - id: p17
    claim: "遭遇したつまずきは2つ。dockerが未導入のサーバでは、sudoも付けずにパッケージを入れ始めるためroot以外では失敗する（別ユーザーなら事前の下準備が必要）。もう一つはイメージのビルド中に通信で落ちるもので、ログに出たdockerコマンドを単体で実行しても再現したためツール側の問題ではなさそうで、手元のDockerを再起動すると通ったりした。"
    kind: example

  - id: p18
    claim: "Herokuの有料化が騒ぎになる前にこれが仕上がっていたら、選べる手が増えてよかったのに、という感想を持った。クラウドの費用に不満がない人には要らない道具だが、出費を抑えて自前のサーバで色々やりたい人には実用になりそうで面白い。"
    kind: opinion

  - id: p20
    claim: "ツール自体の仕上がりはまだ低い、よく言えば伸び代だけがある状態なので、それを面白がれる人なら手を出してみるとよさそう。筆者自身もcapistranoで回しているアプリをこれに移してみようかと思った。"
    kind: opinion
