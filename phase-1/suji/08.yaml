source: facts_coarse/08.yaml
thesis: "Railsで型チェックを通そうとすると回避策だらけになるが、それは厳密な型の道具だと思うからで、開発者テストのように不完全でも役に立つしくみとして、使う人が手を入れながら育てていくものと捉えた方がよい。"
moves:
  - q: "これは何の記録で、どこまでが書かれているのか"
    role: 背景
    says: "Railsアプリへ型チェックを持ち込もうとした試行錯誤の記録で、困った点と抜け道をまとめたものである。"
    uses: [p1]

  - q: "実際に何でどう詰まるのか"
    role: 問題
    says: "Railsがクラスメソッドを入れ子モジュールで定義する仕掛けのせいで検証まわりが通らず、宣言を足したり検査を外したりして切り抜けることになる。"
    uses: [p5, p6, p8, p22, p4, p9]

  - q: "足りない型定義は誰がどこまで書くものなのか"
    role: 根拠
    says: "型定義はgem同梱か持ち寄りのリポジトリへ足す形で共有され、作者でない人が書くなら公布済みインターフェイスと見なせる範囲でよさそうだ。"
    uses: [p3, p12, p13, p14, p15, p7]

  - q: "この状態のまま実務に乗せられるのか"
    role: 限界
    says: "範囲を部分的かつ柔軟に決められることが何より大事で、型ガードの不在や型定義の未整備もまだ残っている。"
    uses: [p10, p20, p21, p19]

  - q: "では、これをどういうものとして受け取ればよいのか"
    role: 主張 | 結論
    says: "厳密な型やその代わりを求めるのではなく、開発者テストのように不完全でも役に立つ、関係者が協力して育てる仕組みと捉えた方がよい。"
    uses: [p18]
