source: facts_coarse/06.yaml
thesis: "この本の読みどころは個々の技法ではなく、流行りの設計論を避けて理解しやすさと変更しやすさを優先する著者の一貫した構えにある。全部を真似る必要はなく、仲間と設計を論じ合う材料として読むのがよい。"
moves:
  - q: "これはどういう本で、誰が書いたのか"
    role: 背景
    says: "Railsの設計で頭を抱えた経験のある人向けの、長く生き延びてきた人が語る定石という手触りの本で、著者の経歴がその手触りの出どころらしい。"
    uses: [p1, p18, p2]

  - q: "この本の言う「持続可能」とは何で、著者は何に与しないのか"
    role: 問題 | 根拠
    says: "持続可能性とは条件や顔ぶれが変わっても開発を続けられることで、著者は流行りの設計論に与さず読みやすさと直しやすさを掲げる。"
    uses: [p3, p9, p13, p5]

  - q: "その構えは具体的にどういう設計になって現れるのか"
    role: 根拠
    says: "レールから外す箇所を選び、業務のロジックはモデルから引き剥がしてサービス層へ移すが、ActiveRecordは便利なデータアクセスの層として残す。"
    uses: [p6, p7, p8, p12, p11]

  - q: "サービス層というとき、そんなに大層なものを持ち込むのか"
    role: 譲歩 | 根拠
    says: "ここで言うサービスクラスはただのRubyのクラスで、作法は細かいが理由がその場で述べられるので身構えなくてよい。"
    uses: [p14, p15, p21, p17]

  - q: "では、この本をどう読めばよいのか"
    role: 主張 | 結論
    says: "読みどころは個々の技法より著者の一貫した構えで、全部真似るのではなく仲間と設計を論じ合う材料として読むのがよい。"
    uses: [p20, p4]
