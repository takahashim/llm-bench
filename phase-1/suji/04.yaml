source: facts_coarse/04.yaml
thesis: "OSSのRailsアプリを並べてみると、app/直下にどんな独自ディレクトリを足すかは各プロジェクトの方針次第で、数も基準もまるで違う。真似する値打ちがあるのは、足したディレクトリの役割をREADME.mdで説明しておくGitLabのやり方だ。"
moves:
  - q: "そもそもapp/直下に独自のディレクトリを足すとはどういうことなのか"
    role: 背景
    says: "app/はアプリ本体を収める場所で、足す必要は本来ないが、込み入ってくるとRailsを広げる形で独自のディレクトリが作られる。"
    uses: [p1]

  - q: "では実際のアプリはどうなっているのか。あまり足さない側から見るとどうか"
    role: 根拠
    says: "ほとんど標準どおりのもの、Rails初期の4つだけのもの、2つだけ足したものがあり、足さない側でも中身の作りはばらばらである。"
    uses: [p4, p5, p6, p7, p8]

  - q: "たくさん足している側はどうなっているのか。散らかっているのか"
    role: 根拠
    says: "数が多くても受け持ちがはっきりしているアプリがあり、そこでは各ディレクトリに置かれるクラスの型も揃えられている。"
    uses: [p9, p10, p11, p12, p13, p14, p15]

  - q: "数が多ければそれでよいのか。読めなくなる例はないのか"
    role: 問題 | 限界
    says: "数が極端に増えると、どんな方針で足しているのかがドキュメントを読んでも読み取れなくなる。"
    uses: [p17, p18]

  - q: "この並べ比べから持ち帰るものは何か"
    role: 主張 | 結論
    says: "独自ディレクトリの数も基準もアプリごとに違うので一般解はなく、真似する値打ちがあるのは役割をREADME.mdで説明しておくGitLabのやり方である。"
    uses: [p3, p19, p16]
