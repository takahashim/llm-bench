source: texts/train/18-qiita-63b301ba88207e.md
title: "Wikidata上での議会・議員のリンク構造の現状と課題"
reader: "Wikidataに日本の議会・議員のデータを登録したり、そこからクエリを書いたりしたい人"
thesis: "Wikidataの日本の議会と議員は、とくに市区町村のあたりで書き方が地区ごとに揺れていて素直なクエリでは拾えないので、登録件数が膨らみきる前に共通の基準を決めてデータ側を直すべきである。"
points:
  - id: p6
    claim: "市区町村議員のあたりは地区ごとの揺れが大きい。ここでは qualifiers、つまり修飾子が登場するので、図を描くにあたってプロパティをEdgeのラベルに置かず、Nodeとして独立させる書き方に変えている。"
    kind: fact

  - id: p12
    claim: "日本の地方公共団体の数は、wikipediaによれば市791、特別区23、町744、村183、合わせて1,741だという。比較としてフィンランドでは、municipal council in Finland にあたるエンティティが304件用意されている。"
    kind: example

  - id: p3
    claim: "国会と都道府県議会は互いに近い形をしているが、市区町村議会の方は作りが少し違っている。"
    kind: fact

  - id: p10
    claim: "単純に議員の人数が多いぶん、首長よりも議会の方が悩ましいと著者は言う。とはいえ首長の側も揃っていないので手を入れたい。それぞれについて、登録される数が増えてしまう前に共通の基準を決めて揃えておきたいところで、クエリの側で頑張るのは悪手だとしている。"
    kind: opinion

  - id: p1
    claim: "国会、都道府県議会、市区町村議会といった議会側の構造と、国会議員や地方議員といった議員側の構造が、いまひとつ揃っていない。著者はこれを何とかしたいと考えており、最終的にはデータそのものをごりごり書き換える話になる見込み。対応策を練る前段としてまず現状をまとめた、という位置づけの記事。"
    kind: fact

  - id: p8
    claim: "知事の書き方も揺れていてクエリは厳しい。プロパティは公職(P39)で揃っているものの、その先が都道府県知事という項目(Q1623534)の場合と、北海道知事を指す項目(Q33134383)のような個別のエンティティの場合がある。前者を使っていても、修飾子に管轄・適用区域(P1001)を当てている例と、以下についての(P642)を当てている例に分かれる。"
    kind: fact

  - id: p11
    claim: "市区町村の議会について言えば、議会ごとにエンティティを立てるべきかを考える必要がある。立てずに修飾子で押し切る方がよい気もするが、Wikidataらしい考え方に立てば、議会単位で情報を集めたいなら各議会にあたるエンティティがあるべきではないか、という気もしてくる、と著者は迷いを書いている。"
    kind: opinion

  - id: p4
    claim: "都道府県議会というエンティティ(Q28362371)は、legislative house つまり議院の項目(Q10553309)のサブクラスに置かれている。ところが市区町村議会の方は、立法府の項目(Q11204)と本会議の項目(Q1752346)のサブクラスという扱いになっている。"
    kind: fact

  - id: p13
    claim: "市区町村長と都道府県知事について実際に動くクエリは、別の記事にまとめたとして案内されている。"
    kind: fact

  - id: p2
    claim: "Wikidataが抱える情報はそもそもグラフの形になるので、構造の説明にはDOT言語を使った図を用いている。例として挙げるのは、衆参両院に加えて東京都議会、兵庫県議会、神戸市会、練馬区議会からたどっていく形。全部は載せず主だったものに絞っている。"
    kind: fact

  - id: p5
    claim: "衆議院議員と参議院議員の方は揃っているようで、取り立てて問題はない。国会については他国と構造を分け合っているらしく、日本ではまず使わない国民議会議員という項目(Q1055894)が見えるのはそのせいだという。"
    kind: fact

  - id: p9
    claim: "市区町村長の情報はまだWikidataにあまり載っていない気がすると著者は述べ、参考として都道府県知事の側の問題を取り上げている。なお知事のデータはその後に大幅な手直しが入ったため、現在は記事当時と大きく違うという追記が付いている。"
    kind: fact
    scope: "記事執筆当時の状況。知事のデータは後に改修済み"

  - id: p14
    claim: "記事に貼られているDOTの記述は、各議会や議員の項目と、サブクラス関係やプロパティのつながりをノードと矢印で書き下したもの。知事と地方議員の分はそれぞれ別の記述として載っている。"
    kind: code

  - id: p7
    claim: "議員をどう記述するかが揃っていないため、素直に書いたクエリでは拾いきれそうにないと著者は見る。公職(P39)というプロパティを使う点は共通だが、指し先が日本の地方議会議員という項目(Q11505877)の場合と、神戸市会議員を指す項目(Q50178404)のような個別のものの場合がある。さらに前者を使っていても、修飾子に管轄・適用区域(P1001)を使う例と以下についての(P642)を使う例に分かれている。"
    kind: fact
