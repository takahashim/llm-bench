source: texts/train/03-zenn-dd33856c7793df.md
title: "ビルド不要で簡単にWeb Componentsできる軽量フレームワークTonic"
reader: "素のHTMLにちょっとした部品を持ち込みたいWeb開発者。Web Componentsの存在は知っている程度でよい"
thesis: "Tonicは大きなアプリを組むための道具ではないが、HTMLと少しのCSS・JSをまとめて使い回したいだけの場面なら、環境構築もビルド工程も用意せずに部品化できる。小さく割り切られていて今後も大きく動かないであろうことが、かえって安心して頼れる理由になっている。"
points:
  - id: p12
    claim: "作者のSocket Supply Co.は、P2PでWebを散らそうという古くからの路線の会社で、近年のWeb3にまったく共感できない人でも納得できる種類の分散システムを手がけているらしい。"
    kind: fact

  - id: p4
    claim: "実態としては、HTMLElementを継承したクラスを一つ作っているだけと言っても言い過ぎではない。"
    kind: opinion

  - id: p9
    claim: "JSを別ファイルに切り出した構成でも動作する。"
    kind: code

  - id: p2
    claim: "公式が挙げる売りは、ファイルもクラスも1つだけで本体が350行ほどという小ささ。HTMLエスケープ用の文字列クラスがおまけで付く。"
    kind: fact

  - id: p14
    claim: "完成度は本番投入に足るし設計も片付いているので今後大きな変更を告知することもないだろう、という脱力した書き方をしつつ、それこそが長く安心して使える根拠だと売り込んでいる。"
    kind: opinion

  - id: p6
    claim: "routerも状態管理も持たないので、SPAを組む道具ではない。カスタム要素の内側で状態を抱える程度なら普通にできる。"
    kind: fact

  - id: p1
    claim: "TonicはHTMLの中で使える部品を定義するための小さなフレームワーク。"
    kind: fact

  - id: p10
    claim: "カウンターの例では、constructorはWeb Components共通の作法、renderも既出なので、実質的に目新しいのはclickの扱いだけ。"
    kind: code

  - id: p8
    claim: "単純な部品ならクラスではなく関数の形でも定義できる。"
    kind: code

  - id: p5
    claim: "売りの一つである豊富な実例とは、Tonicで書かれた公式の部品集のことだと思われる。踏み込んだ書き方を知りたいときはそこを参照するとよい。"
    kind: opinion

  - id: p3
    claim: "ビルド工具が要らず、ブラウザ本来のWeb Componentsに乗っており、JAMStackにも合い、クライアント側とサーバ側で同じように動き、組み合わせ重視で、イベントの移譲を初めから備える、という点も挙げられている。"
    kind: fact

  - id: p13
    claim: "会社のブログでも紹介されていて、指導者的な存在もコアチームも置かず、Patreonや定額課金、広告、企業向けの別版、大規模な催し、取り巻きの集まりも一切ない、ただ仕事を片付けるための道具だ、という一節が面白い。"
    kind: example

  - id: p7
    claim: "ひとまず動かしてみるだけならCDNから読み込む形にして、HTMLファイル1枚で試せる。"
    kind: code

  - id: p11
    claim: "加算と減算の2つのボタンに対してハンドラは1つしかなく、子のspanで起きたイベントを親のカスタム要素側で受け取っている。親からはどの子孫が発生源か分からないため、Tonic.matchとdata属性で振り分ける。この都合でbutton側にidを振る必要がある。"
    kind: code
    scope: "イベント移譲を使う場合"

  - id: p15
    claim: "いろいろな面で風変わりな道具で面白い。"
    kind: opinion
