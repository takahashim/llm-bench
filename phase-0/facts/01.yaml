source: texts/train/01-zenn-a968b62db39598.md
title: "西暦2023年、オブジェクト指向に興味を持った入門者にお勧めする日本語書籍を考える"
reader: "プログラミングを始めたばかりの人に読ませる本を探している人、またはOOPを学び直したい開発者"
thesis: "2023年の時点でOOPの初学者に薦められる和書はごく限られていて、ここに並べた数冊はあくまで足がかりにすぎない。全体を一語でくくった本で満足せず、その先は継承や設計技法といった個々の要素を扱う本へ進むのがよい。"
points:
  - id: p9
    claim: "田中ひさてる『ちょうぜつソフトウェア設計入門――PHPで理解するオブジェクト指向の活用』は、PHPを題材にOOPの使いどころを説くもので、章の並べ方がいちばんの推しどころ。扱う範囲は網羅的でなく粒度もばらついているが、現代の基礎教養として何が要るのかが伝わってくる。"
    kind: opinion
    scope: "入門を終えて最低限のコードは書けるが設計がわからない層向け"

  - id: p3
    claim: "海外の定評ある本は訳が出てからしばらく経っているものばかりで、近年これというものが浮かばない。国内でも良書が次々刊行されている状況ではなさそう。"
    kind: opinion

  - id: p15
    claim: "Sandi Metz『オブジェクト指向設計実践ガイド』はやや年季が入っているが、この領域はそれほど移り変わらないので今も挙げられる。Rubyでの設計、とくにOOP寄りの話が詳しいのはこの一冊。"
    kind: opinion
    scope: "Rubyが前提の読者向け"

  - id: p1
    claim: "ある場で入門者向けのOOPの本を尋ねられて即答できず考え込んでしまったのが、この選書を書いた動機。"
    kind: fact

  - id: p12
    claim: "きしだなおき『オブジェクト指向神話からの脱却』は単行本ではなく、休刊した隔月刊誌WEB+DB PRESSのVol.132に載った特集記事。"
    kind: fact

  - id: p6
    claim: "10年以上前の本でも今なお読む値打ちのあるものは多数あるが、そこは我慢して刊行の新しいものだけに絞った。"
    kind: fact
    scope: "選定方針"

  - id: p17
    claim: "質問者の文脈からRubyが前提だろうと見当をつけて1冊加えた。TypeScriptやGo、Swiftでは思い当たるものがなく、Pythonなら何かあるかもしれない。"
    kind: fact

  - id: p4
    claim: "本が出そろわない事情として、この技術がもはや当然のものになって旬の話題ではなくなった一方、込み入った部分と積み重なった来歴は残っており、初学者への説明が楽になったわけではない点がありそう。"
    kind: opinion

  - id: p8
    claim: "予備知識ゼロの人に向けて、2023年にも当たり前に使われている技術として紹介する役割は今も果たせる。とくに第3章から第5章は、それ以前の流れを踏まえて「なぜそうなったのか」を説いており、今では教わる機会がほとんどない。"
    kind: opinion

  - id: p14
    claim: "広まらずに終わった技術として分散オブジェクトとオブジェクト指向データベースを取り上げているのが、渋くて良い。"
    kind: opinion

  - id: p7
    claim: "平澤章の『オブジェクト指向でなぜつくるのか』第3版は2021年刊だが、GoやRustが普通に選ばれる現在を知るには物足りない面もあるのでは、という懸念がある。"
    kind: opinion

  - id: p18
    claim: "ここに並べた数冊を読めば万全という代物ではなく、周りを眺める程度のもの。各技術を深く知るには、大きくくくった言葉の本ではなく要素ごとの本に進むべき。"
    kind: opinion

  - id: p11
    claim: "どちらの本にも最後にアジャイル開発の章があるが、設計ともOOPとも関わりが薄いと感じる。2023年にわざわざ抱き合わせで紹介しなくてもよいのではないか。"
    kind: opinion

  - id: p13
    claim: "題名だけ見るとOOPを否定する記事かと思われそうだが、中身は書籍よりも踏み込んだ考察で、〈神話〉として担ぎ上げられがちなこの言葉の来歴と実情を扱っている。壮大な理想と現実のずれから、なぜ神話化したのかを説く部分が参考になる。"
    kind: opinion

  - id: p16
    claim: "より新しいものを求める人には、同書の2nd edition（2018年刊）が英語で入手できる。"
    kind: fact

  - id: p10
    claim: "開発の進め方の紹介にロバストネス分析を持ち出す点が興味深い。それを含むICONIXくらいしか2023年に手に入る体系は残っていないのでは。DDDを挙げる人もいそうだが、PoEAAが進め方の体系でないのと同様、設計の技法・考え方の一つという立ち位置だと見ている。"
    kind: opinion

  - id: p5
    claim: "使う言語によって、この考え方の用いられ方や用い方は少しずつ違っているのではないか。"
    kind: opinion

  - id: p2
    claim: "2023年に初学者向けのこの分野の本を探すのは難しい。もっとも、別の分野なら簡単というわけでもない。"
    kind: opinion
