source: texts/train/10-zenn-ad3b365c6b56ed.md
title: "Rubyアンチパターン: なんでもクラスメソッド"
reader: "Rubyを学び始めて自分でクラスを書くようになった人。特異メソッドの仕組みのような話は前提にしない"
thesis: "クラスメソッドを並べる癖は足りていない設計を覆い隠すので、コンストラクタのような限られた用途を除いて、処理はインスタンスを用意してから呼ぶ形に寄せた方がよい。"
points:
  - id: p9
    claim: "クラスメソッドが受け取る引数がどんどん膨らんでいくのも、同じ崩れ方が進んだしるし。"
    kind: fact

  - id: p3
    claim: "移し先の第一候補になるのは、引数として渡しているオブジェクトのクラスだが、それ以外が適任のこともある。"
    kind: opinion

  - id: p12
    claim: "神クラス、なんでもユーテリティクラスが、近い性質のアンチパターンとして挙げられている。"
    kind: fact

  - id: p1
    claim: "インスタンスメソッドであれば、所属するクラスとそのサブクラス群のオブジェクトを通してしか起動できない。"
    kind: fact

  - id: p6
    claim: "呼び出しを一手で済ませる便利メソッドを1つだけクラスメソッドとして置く手法も広まっているが、それ以外はすべてインスタンスメソッドの方に書く。"
    kind: fact

  - id: p14
    claim: "著者は、必要なことの大半が翻訳記事「Rubyのクラスメソッドがリファクタリングに抵抗する理由」で既に語られていたと述べている。"
    kind: fact

  - id: p5
    claim: "クラスメソッドはプログラムのどこからでも起動できてしまうため、無縁な場所から使われたり、筋の通らないクラスに処理が居座ったりする。結果として部品として扱いにくいクラス群になる。"
    kind: fact

  - id: p11
    claim: "そのわずかな手軽さしか得られないなら、呼ぶたびにnewする方が筋が通って分かりやすいこともある。"
    kind: opinion
    scope: "便利メソッドを1つ置く手法を選ぶ場合"

  - id: p2
    claim: "Rubyにおいてクラスメソッドはやや特別な存在で、メソッドは基本的にインスタンスメソッドの側に置くものだと構えておくくらいでよい。"
    kind: opinion

  - id: p8
    claim: "コンストラクタをnew以外の名前でクラスメソッドとして用意するのは、Foo.create_with_bar のようなイディオムとして定着している。生成が済んだら、あとはできたオブジェクトのインスタンス側のメソッドで扱えばよい。"
    kind: fact
    scope: "コンストラクタの場合"

  - id: p4
    claim: "コンストラクタが数十行に伸びたり、分割したくなる規模になったら、コンストラクタ専用の別クラスを立てることを検討したい。"
    kind: opinion

  - id: p7
    claim: "クラスごとの責務、つまり役割分担がぼやけてくるので、たいていは設計そのものを見直すべき合図と見た方がよい。"
    kind: opinion

  - id: p10
    claim: "クラスメソッドばかりが並び、インスタンスメソッドの定義が数えるほどしかない、あるいは一つもない状態になる。"
    kind: fact

  - id: p13
    claim: "クラスメソッドが別のクラスメソッドを次々と呼び合う形になりやすい。"
    kind: fact

  - id: p15
    claim: "ふさわしい受け皿のクラスが見つからないなら、新しくクラスを作ってそこのメソッドにする。必要なクラスを用意しないまま無理に定義した結果、クラスメソッドになっていた可能性がある。"
    kind: opinion
