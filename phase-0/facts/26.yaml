source: texts/train/26-qiita-49adf2f0b27aca.md
title: "Re:VIEWをこうしたい計画（私案）"
reader: "Re:VIEWを使っている・開発に関心がある人。config.ymlやcatalog.ymlの役割を知っている前提"
thesis: "Re:VIEWの次の版に向けて筆者が考えている改造の見取り図。書籍単位の「プロジェクト」を軸に据え、設定をconfig.ymlへ寄せ、Web出力・国際化・parserを作り直すという方向だが、どれも合意済みの決定ではない。"
points:
  - id: p9
    claim: "かつては環境ごとにconfig.ymlを取り替える立場だったが、それもDRYとは言えないと感じ、今は1つのファイルへ寄せたいという結論に傾いている。まとめるのなら、何も指定しないときに読まれる既定にしてしまってもよいのかもしれない。kdmsnrさんから同じ趣旨の主張が出ていた記憶があるという。"
    kind: opinion

  - id: p14
    claim: "ブロックの種類の違いは少なくとも2通りある。中身として別のブロックを置けるもの（//lead{ の類）と、置けないもの（//emlist{ の類）。以前はこの2つを分けていなかったので、入れ子がうまく動いていなかった。"
    kind: fact

  - id: p2
    claim: "書籍を指す呼び名は「プロジェクト」が合いそうで、これを公式の用語にしたい。『はじめてのReVIEW』で用いた語でもあるから。"
    kind: opinion

  - id: p6
    claim: "config.yml 以外から渡すオプションは可能な限り削り、「そこでしか指定できない」状態をなくしたい。review-compile では個別のターゲットを選ぶための --target だけを残し、ほかは --yaml=YAML で与えられるようにする。"
    kind: opinion

  - id: p11
    claim: "ReVIEW::I18n への対応はかなり進んだが、土台の部分で届いていないところが残る。せめて review-init で日本語向けと英語向けの両方を作れるようにし、英語用のconfig.yml を別に持たせて、英語のときはそちらが生成されるようにしたい。"
    kind: opinion

  - id: p1
    claim: "これは筆者の私案であり、誰かと話をつけたものではない。2.0の頃に入れたいと思っていたが、全部やり切るには時間がかかるので、いくつかに分けて最後は3.0あたりに回す方がよいかもしれない。"
    kind: opinion

  - id: p16
    claim: "HTMLなら要素ごとに中身として何を置けるか決められる（スキーマでもそう定義されている）。一方こちらは、review-ext.rb のような仕掛けで後からタグを足せてしまうので、要素ごとに前もって決め打ちできない。足すときに区別を付けられる仕組みが要る。追記では、普通のブロックを宣言する Compiler.defblock に加えて Compiler.defcodeblock を用意し、パーサが走る時点で要素かどうかを調べる形で決着したと書かれている。"
    kind: fact

  - id: p4
    claim: "Webサイト向けのHTMLを出せるように、WEBMaker（仮の名前）を作りたい。Web向けの版では、サイトのメニュー（スマホならメニューの中）に目次が出るほか、前後の章へ飛ぶリンクとトップへのリンクが付く。"
    kind: opinion

  - id: p17
    claim: "書式の誤りを見つける仕組みは後回しにしたい。最初の段階では難しく、たとえば波括弧の付いていない `@<br>` のような中途半端なタグを、エラーにせずただの文字列として読み流してしまいそうだから。規則を練れば弾けるはずだが、そこまでやるには時間がかかる。"
    kind: opinion

  - id: p3
    claim: "書籍（章をいくつも束ねたもの）の設定は、catalog.yml とconfig.yml を書くところから入る。加えて、手軽に扱えるよう章ごとにコンパイルする道も用意されている。概念をはっきりさせるには、書籍の単位でデータやファイルを作る方をもっと前へ押し出すべき。やることは、review-init の使い勝手を上げて勧めること、そして文書を直すこと。"
    kind: opinion

  - id: p13
    claim: "parserの差し替えは進みが遅いものの、細々と続いている。行の中に書く記法を入れ子にできるようにする方は、実現できそうだとしている。"
    kind: fact

  - id: p7
    claim: "catalog.yml やlocale.yml もconfig.yml 内の設定項目として書けるようにして、暗黙の既定という扱いをやめたい（書いて示せるようにするだけで、黙って読まれるのではない既定としては残るのかもしれない）。"
    kind: opinion

  - id: p10
    claim: "こちらは逆にコマンドラインのオプションが増える方向で、--env sample や --env printing のように指定して、別々の文書を作れるようにしたい。使い分けたいのは、標準となる電子書籍のPDFとEPUB、章をいくつかに絞り（catalog.yml を差し替える）「続きは云々」の案内を挟む試し読み版、そして表紙なし・モノクロ指定（画像の扱いは未定）の印刷用PDFの3つ。"
    kind: example

  - id: p5
    claim: "HTMLのテンプレートはtemplatesというディレクトリに集め、テンプレートエンジンを通す形にしたい。XHTML1.0とHTML5の両方を受け持つ時点ですでに破綻しかけており、Web向けの出力を足すと手に負えなくなりそうだから。ERbで足りるのではないかと見ている。"
    kind: opinion

  - id: p12
    claim: "国際化を進めるなら review-init の既定は英語の方がよさそうだが、日本語を使う人にとっては毎回 --lang ja を打つのが面倒なだけなので踏み切れない。review-jinit のような別のコマンドを足す方がよいのかもしれない。"
    kind: opinion

  - id: p15
    claim: "追記によれば、普通のブロック要素のほかにコードブロック要素を設けることで決着した。この新しい方は入れ子を認めず、改行の情報なども落ちない作りにしてある。"
    kind: fact

  - id: p8
    claim: "params: の下でしか書けない設定をなくし、config.yml の直下に項目を立ててそこで指定できるようにしたい。"
    kind: opinion
