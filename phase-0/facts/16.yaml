source: texts/train/16-qiita-e51927d473f18c.md
title: "Rubyコーディングスタイルの現状とStandard gemのご紹介"
reader: "Rubyで仕事をしていて、コーディング規約やオートフォーマッタに関心のある開発者"
thesis: "Rubyに公式のスタイルは当面できないが、設定不要の共通スタイルを狙うStandard gemが育ちつつある今は意見を差し込む好機なので、言いたいことがあるなら早めに開発の場へ持ち込んだ方がよい。"
points:
  - id: p15
    claim: "Standardが選んだ書き方は、字下げが2 spaces、文字列リテラルは基本的に「\"」、Hashは1.9以降の {hash: syntax}、ブロックは値を返す関数的な用途なら {…}、副作用を起こす手続き的な用途なら do…end、複数行にわたるメソッドチェーンでは「.」を行末に置く、というもの。"
    kind: fact

  - id: p4
    claim: "まつもとさんの発言より。余計な差分が生まれないようにしておけば、規約そのものは要らないのではと思ってしまう。3回しか顔を出さない変数の名前が長かろうが i だろうが、どうでもよくないか。まずい書き方をしてしまっても、レビューの場でこれだけでは判断できないと指摘されれば、それで足りる。"
    kind: example

  - id: p18
    claim: "追記として、qiitaで規約関連のタグを眺めていたら、前日に公開されていた記事はJavaScript Standard Style を扱うものだった。そちらには否定的な声もそれなりにあるらしい。JavaScriptでセミコロンを禁じる方針は、それこそ瑣末な論争が盛り上がりそうだと著者は漏らす。"
    kind: opinion

  - id: p1
    claim: "Rubyにはコーディングスタイルの公式な取り決めがなく、公式のフォーマッターも用意されていない。言語の作者であるまつもとさんも、統一のルールを掲げることには積極的でないようだ。"
    kind: fact

  - id: p11
    claim: "この道具が人目に触れたのは Lightening Talks(RubyConf 2018)での発表で、著者もそこで初めて知ったという。動画へのリンクは公式リポジトリに置かれている。作者のJustin Searlsはオハイオ州に住む人で、かつて滋賀で暮らしていたとのこと。RubyKaigi 2016で基調講演をしているので、素性の知れない人物が突然言い出した話ではない。"
    kind: fact

  - id: p7
    claim: "ただ最近は、その最後の論点のほうが広く支持されているのか、規約を自前で用意したり、整形ツールを取り入れたりする動きが目につくと著者は見る。"
    kind: opinion

  - id: p16
    claim: "眺めてみると意外なものはないが、受け入れられない人は受け入れないだろうし、まさにバイク小屋が建ちそうな論点でもある。著者個人はブロックの扱いに引っかかりがあり、1行は {...}、複数行は do..end の立場だが、どうしても飲めないというほどではない。"
    kind: opinion

  - id: p5
    claim: "まつもとさんの発言より。RuboCopをはじめとする静的解析の道具に値打ちがあることは理解しているし、携わっている人たちにも敬意を持っている。それでもRuboCopが既定で有効にする規則には、自分の好みと食い違うものや、どうしてこうなのかと首をかしげるものが混じっている。"
    kind: example

  - id: p13
    claim: "READMEによれば持ち味は3つ。No configuration は設定を書かずに使う前提という意味(実際には除外するディレクトリの指定などはできる)。Automatically format code は standardrb --fix で勝手に直るということ。残る1つは、スタイル上の不備や書き手の間違いを早い段階で拾って、レビューに費やす貴重な時間と、コントリビューターとレビュアーの間の往復を削ること。"
    kind: fact

  - id: p2
    claim: "まつもとさんの発言より。規約がないと仕事にならないと言う人に対しては、それは自分の頭で決めるものではと感じてしまう。もっとも、字下げの幅やスペースとタブの選択については、後から直すと差分が膨大になるので先に決めておいた方がよい。"
    kind: example

  - id: p9
    claim: "Rubyで最も普及している道具と言えばRuboCopだという見解は、おおむね賛同を得られるはず。ただしRuboCopは細かく設定を変えられるのが持ち味で、現実にはかなり手を入れた状態で使われていることが多い。便利な反面、もっと気軽に素のまま使える整形の道具がほしいという気持ちも湧く。"
    kind: opinion

  - id: p17
    claim: "著者はこの記事で導入をすすめているわけではない。言語の作者が標準を定める気がない以上、公式のスタイルが現れるのはしばらく先だろう。コミュニティ側に強制力のない事実上の基準が生まれるか、生まれたとしてどんな姿になり、読者にとってどれだけありがたいものになるのか、その程度の話にとどまる。手元のリポジトリの設定は、これまで通り自分の好みで決められる。"
    kind: opinion

  - id: p12
    claim: "中身はRuboCopの上に作られていて、standard --help を打つと rubocop 用の usage 表示が顔を出すほどだった(最近の版では見られなくなっていた)。差が出るのは、結局どのcopを既定で有効にするかという設定の部分になる。"
    kind: fact

  - id: p6
    claim: "まつもとさんの発言より。プログラマは自分で判断する部分を持つ職業なのだから、自分に関わることは自分で決めればよい。乳児の世話をするように一から十まで指示に従えというのは専門職としての扱いではなく、自分がそう扱われたくないので他人にもそうしたくない。もっとも、道具に任せると煩わしさが減るというはっきりした理由があるなら、それで検査して従えばよい。"
    kind: example

  - id: p8
    claim: "他の言語の状況として、PythonはPEP 8で標準ライブラリ向けのスタイルを文書化し、Goは標準添付の整形ツール gofmt を配り、JavaScriptの世界には JavaScript Standard Style が現れ、prettierの利用も目立つ。Rubyにも同種のものがほしい、どうして無いのかという声が出るのは当然だろう。"
    kind: fact

  - id: p14
    claim: "導入は gem install standard で済み、あとは対象リポジトリの最上位でコマンドを走らせるだけ。Gemfileに gem \"standard\" を加えて bundle exec standardrb --fix とする形でもよい。--fix を外した場合は警告の表示だけになる。"
    kind: code

  - id: p3
    claim: "sinatraのコードに当てて差分を確認したところ、「'」を「\"」へ置き換える修正が最多で、その次に目立ったのはHashのキーをhash rocketから書き換えるものだった。"
    kind: example

  - id: p19
    claim: "もし関心があるなら、あるいは妙な形で固まると困ると感じるなら、早めにStandardのリポジトリにissueを立てるかpull requestを投げるのがよい。固まった後では意見が届きにくくなる(そうでなければ決めた意味がない)ので、いまが頃合いだと著者は言う。"
    kind: opinion
