source: texts/train/08-zenn-69e48acfcf8ff4.md
title: "昔から使われている技術用語をさかのぼる: Value Object編"
reader: "Value ObjectのようなOOP・パターン系の用語を使っているが、その出どころを知らない開発者"
thesis: "Value Objectという語は、分散環境やマルチスレッド、性能といった1990年代後半の関心から生まれたもので、その背景を押さえずに名前だけを現代へ持ち込むと噛み合わない。来歴を確かめたうえで意味を付け直すか、別の言葉を作る方が表現は豊かになる。"
points:
  - id: p12
    claim: "論文の「2.2 Performance consequences」などで検討されているのは、プロセスの境界を越えて一つのオブジェクトを共用しようとすると注意点が増えるという話。分散先で中身が書き換わったらどうするか、受け渡す際に別のオブジェクトへの参照を抱えていたらどうするか、参照が循環していたら検査が必要ではないか、といった論点が並ぶ。値らしい何かがあればうまく避けられるのでは、という流れになっていたらしい。"
    kind: fact

  - id: p3
    claim: "OOPやパターン方面の語の出どころを辿りたいときの参照先としては、Wikipedia ではなく C2 Wiki が向いている。"
    kind: opinion

  - id: p15
    claim: "軽量（lightweight）であることを気にしている点も見落とせない。DBへしまうことを見据えてのことらしく、1カラムにそのまま入れる想定だったようだ。加えて分散した環境でのやり取りを減らすため、当時の計算機の性能事情もあってか、値そのものを小さく保ちたいという思惑が感じられる。"
    kind: fact

  - id: p1
    claim: "ソフトウェアパターンの話題が盛り上がっていた頃からもう20年以上が経っている。状況も様変わりしており、その時代のことなど知るわけがない、むしろ知ったことではないという人も多いだろう。"
    kind: fact

  - id: p9
    claim: "C2 Wiki のページから辿れる「Values in Object Systems」は1998年の論文で、まさにこの概念を論じている。1998年10月といえば JDK 1.1 の頃で、Java にとってもかなり早い段階。"
    kind: fact

  - id: p6
    claim: "C2 Wiki自体もWikiなので書き換わる。昔の記述を押さえたいならInternet Archive経由で見ておくのも手。"
    kind: opinion

  - id: p16
    claim: "まとめると Value Object は、OOPがこれから来るかという時代に、オブジェクトではない値も便利だし、OOPでも値らしきものを使いたい、という発想から出てきたもの。当時の関心事は、分散した環境への備え、マルチスレッドでのプログラミング、そして性能あたりにあったようだ。"
    kind: fact

  - id: p4
    claim: "C2 Wiki は WikiWikiWeb 、すなわちWikiの始祖のような存在。iki-iki にも紹介が載っている。"
    kind: fact

  - id: p13
    claim: "この概念をめぐってシリアライズ・デシリアライズの話題が盛んに交わされたのは、こうした事情も効いていたらしい。"
    kind: fact

  - id: p2
    claim: "それでも、今なお現役の語について当時どう使われていたかを知ると、理解が進むこともありうる。"
    kind: opinion

  - id: p7
    claim: "気をつけたいのは、URLの規則が途中で切り替わっていること。以前はCGIで動いていたらしく、c2.com の直下にある /cgi/wiki? にフレーズを続ける綴りで辿れる。2002年時点のページもその形のURLから読める。"
    kind: fact
    scope: "Internet Archiveで古いページを探す場合"

  - id: p5
    claim: "この語を掘るなら ValueObject という綴りで引けば当たる。語と語をつなぐ際にそれぞれの頭を大文字にする流儀。"
    kind: fact

  - id: p10
    claim: "論文はHTML版も公開されていて、そちらが読みやすい。"
    kind: opinion

  - id: p8
    claim: "当該ページについては、見た目は別として、中身は2002年の時点から今に至るまでさほど動いていないようだ。"
    kind: fact

  - id: p11
    claim: "CORBA のような分散システムの気配が濃く、当時の流行がうかがえる。"
    kind: opinion

  - id: p14
    claim: "当時の分散の肌触りは、マルチコアのような話はさておき、もともと分けやすい作りを前提に役割の違う計算を散らす今日の分散アーキテクチャとは、違う面もある。ただし筆者はCORBAやEJBに詳しくないので外しているかもしれないと留保している。"
    kind: opinion

  - id: p17
    claim: "次回予告は Domain Model 編だが、嘘かもしれないと添えられている。"
    kind: fact
