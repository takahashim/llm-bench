source: texts/train/13-zenn-279523b22a4eed.md
title: "現代は開発抽象化レイヤーが重層化している、あるいは何を見ても開発抽象化レイヤーに見える"
reader: "ソフトウェア開発の組織論や近年の流行り言葉を、自分の立ち位置と結びつけて整理したいエンジニア"
thesis: "プログラマを支える裏方を覆い隠す仕組みは、いまやそれ自体がソフトウェアとして開発されて何段にも積み重なっており、開発抽象化レイヤーという物差しを当てると近年の流行り言葉も自分の仕事の位置も見通しがよくなる。"
points:
  - id: p12
    claim: "SREもまたこの枠に入る。運用を担うチームも開発者と同じ流儀で手を動かすため、SRE以外の立場でシステムを作る人に向けて、一段優れた開発抽象化レイヤーを差し出せる。加えて、システム開発のために整えられてきた道具立てを運用にも持ち込めるので、運用の側もやりやすくなる。"
    kind: opinion

  - id: p3
    claim: "組込みの分野にはHardware Abstraction Layer、略してHALという用語がある。ハードウェアの差異を吸収して、プログラマにハードを意識させないよう抽象化するものだ。実際には抽象化の漏れが起きやすく微妙な話になるそうだが、著者はそこには踏み込んでいない。"
    kind: fact

  - id: p16
    claim: "副業エンジニアが流行りつつある流れも同じ文脈で読める。開発抽象化レイヤーを築くには、中心となる事業に通じた開発者以外にも多様な役割のITエンジニアが要り、その人たちは常勤である必要も、コアドメインに詳しい必要もないかもしれない。"
    kind: opinion

  - id: p1
    claim: "開発抽象化レイヤーという呼び名はJoel Spolskyによる造語で、原語ではDevelopment Abstraction Layerと書く。2006年に彼が書いたエッセイの題名でもある。日本語に訳したものはInternet Archiveに残っていて、そちらからたどれる。"
    kind: fact

  - id: p8
    claim: "この15年で大きく動いたのは、ソフトウェアがあらゆる領域へ進出したことだと著者は見る。いわゆるSoftware Is Eating The Worldというやつだ。"
    kind: fact

  - id: p17
    claim: "SaaSの流行も同じように説明できるかもしれない。システムを組み上げる際にSaaSを便利な足場として使うことはもはや外せなくなっており、これも広い意味での開発抽象化レイヤーに数えられる。"
    kind: opinion

  - id: p5
    claim: "開発抽象化レイヤーも同様に、プログラマが働くうえで必要になるあれこれを抽象化し、本人が意識しないで済むようにするものだと考えればよい。"
    kind: fact

  - id: p10
    claim: "ここ数年もてはやされた言葉のうち、広い意味でこうした層の構築に関わるものが少なくなかったと著者は見る。"
    kind: opinion

  - id: p14
    claim: "言い換えると、開発者がシステムをもりもり作っていくときのproductivity、すなわち生産性を上げるには、製品の機能そのものを設計し実装する仕事のほかに、それとは別のソフトを作ったり回したりする営みが要るようになった、あるいはその重みが増したということになる。"
    kind: opinion

  - id: p2
    claim: "著者はそのエッセイを大変おもしろいと評し、未読の人には今すぐ目を通すよう勧めている。"
    kind: opinion

  - id: p19
    claim: "そうした層そのものをソフトウェアに仕立てている現場も、自分たちの視点から見た別の開発抽象化レイヤーを使い込んでいる。この重層的な関係こそが現代の開発の特徴だと著者は言う。"
    kind: opinion

  - id: p6
    claim: "エッセイが書かれてから15年以上たっているので、そのまま鵜呑みにして当てはめてよいかは考え直す余地がある。もっとも、仕事としてプログラムを書くという行い自体は、その間それほど変質していない。"
    kind: opinion

  - id: p20
    claim: "いま作っているものが誰のための開発抽象化レイヤーなのか、また自分が頼っている層は何なのかを意識すると、手がけているものと自分のポジショニングが掴みやすくなるかもしれない。著者は、考えを整理するための呼び名としてこの言葉が重宝されるのではないかと見ている。"
    kind: opinion

  - id: p11
    claim: "DevOpsもこの話に関わる言葉のひとつ。運用を重く見る現場で、DevとOpsを隔てる壁の扱いを工夫し、Devの側に立つ人へ一段良い開発抽象化レイヤーを届けることだと読み替えられる。"
    kind: opinion

  - id: p13
    claim: "チームトポロジーも同じ枠で読める。Joelのエッセイにいた昔ながらのプログラマはストリームアラインドチームとして定義し直され、そこにイネイブリングチーム、コンプリケイテッド・サブシステムチーム、プラットフォームチームといった区分が加わる。製品の流れに沿うチームの側から眺めれば、後者はいずれも開発抽象化レイヤーの役を果たしている。"
    kind: opinion

  - id: p9
    claim: "Joelが並べていた顔ぶれは、おおむねソフトウェアを書く人以外の事柄を指していた。しかし、作る人とそうでない人を大雑把に二分する線引きは、いまでは合わなくなってきている。もっと丁寧に区分けし直し、その関係性を組み替える作業が要る。"
    kind: opinion

  - id: p4
    claim: "引用で並ぶのは、静かな個室、強力なコンピュータ、無制限の清涼飲料、室温は20度から22度、快適な椅子、ディスプレイはぎらつかないものといった環境と、郵便や本の注文を引き受ける管理人、システム管理者、テスタ、グラフィックデザイナ、マーケティングやセールスの担当、テクニカルサポートなどの人々で、典型的な会社では彼らが従業員の80%を占めるとされる。"
    kind: example

  - id: p18
    claim: "2006年と比べた今の特色として、開発抽象化レイヤーを築くこと自体を目的としたソフトウェア開発が大きくなり、それを担う人が増えつつあると言えそうだ。"
    kind: opinion
