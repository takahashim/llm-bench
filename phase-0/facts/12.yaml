source: texts/train/12-zenn-3b6bdca62b87a2.md
title: "Rubyアンチパターン：神クラス"
reader: "Rubyでアプリを保守していて、特定のクラスばかり膨らんでいく状況に心当たりがある開発者"
thesis: "何でも引き受ける神クラスは直すほど壊れるようになるので、派手な中枢からではなく小物的な役目から順に別のクラスへ移し、時間をかけて削っていくのが現実的な出口になる。"
points:
  - id: p14
    claim: "God Objectという項目をWikipediaで見ると、組込みのように資源が乏しい状況では神クラスや神オブジェクトに相当するものをあえて使う場合もあるそうだ。ただし著者は意味合いが少し違う気もするとしている。"
    kind: fact
    scope: "組込みなど制約の強い環境"

  - id: p3
    claim: "機能を足すのも直すのも難儀なクラスが居座り、どんな改修でもなぜかそこに手を入れる流れになる。"
    kind: fact

  - id: p11
    claim: "クラス分割についての知見に詳しくなったとしても、実際の解決が楽になるとは限らない。"
    kind: opinion

  - id: p7
    claim: "既存のクラスから機能を引き剥がすというより、新しい概念や役割を立ててそちらを使う形に切り替えると捉えた方がしっくりくる場合もある。"
    kind: opinion

  - id: p1
    claim: "手持ちのクラスだけで機能追加や改修をやりくりしようとすると、ひとつのクラスがあらゆる機能を抱え込み、神クラスが生まれてしまう。この話はRubyに固有の概念ではないが、他言語では事情が違いうるのでRubyの例に絞っていると著者は前置きしている。"
    kind: fact
    scope: "Rubyの例に限定した説明"

  - id: p9
    claim: "ストラングラーパターンでは一度に切り離すのではなく少しずつ移していくため、作業量は増えるが失敗した時の打撃をいくらか抑えられるかもしれない。"
    kind: opinion

  - id: p5
    claim: "細かな修正をしたつもりでも別の機能が壊れるようになり、直すための費用が跳ね上がる。テストが用意されていれば異変そのものには気づけるが、気づいても直すには労力が要る。テストがない現場では、本番に出してから、あるいはずっと後になって壊れていたと判明して苦しむことになる。"
    kind: fact

  - id: p16
    claim: "直すのが重いということは、ここに挙げた立て直しの作業自体も重いということで、面倒だからと先送りすると状態はさらに悪くなる。"
    kind: fact

  - id: p12
    claim: "腐敗防止層を挟むやり方もある。神クラスの解体はいったん諦めて、内側はBig ball of mud、つまり巨大な泥団子と割り切り、呼び出す側から直接触らせない形にする。"
    kind: fact

  - id: p2
    claim: "インスタンス変数もメソッドも数が異様に多く、ソースコードの行数も当然のように長い。"
    kind: fact

  - id: p18
    claim: "腐敗防止層を立てると外側の世界は整理しやすくなるが、その層そのものに手を入れるのは難しく、内側を完全に覆い隠せないこともある。あくまでつなぎの措置で、最後には神クラス本体に向き合うべきだと著者は言う。"
    kind: opinion

  - id: p6
    claim: "小物的なものから剥がす進め方はクラス分割としての効き目は薄いが、育ちきった神クラスを本気で割るには莫大な労力が必要で、勢いでやれば途中で投げ出すことになる。"
    kind: opinion

  - id: p4
    claim: "結局は手頃な粒度のクラスへ切り分けるほかに道はなく、一般には中心的な部分から手を付けるより、使われる範囲が狭い小物的でおまけのような機能のほうから剥がしていく方が無難だと著者は見る。"
    kind: opinion

  - id: p8
    claim: "『レガシーコード改善ガイド』で紹介されている手法として、既存クラスの一部の責務のみを抜き出して独立させるスプラウトクラスと、既存のものを包む形で新しいクラスをかぶせるラップクラスがある。"
    kind: fact

  - id: p13
    claim: "腐敗防止層と巨大な泥団子はどちらもDDDで整理された呼び名で、後者は望ましくない形の例として挙げられている。詳しいのは『エリック・エヴァンスのドメイン駆動設計』。"
    kind: fact

  - id: p10
    claim: "小物的な機能もいつかは切り離さねばならないので、地道に労力を割きながら長い時間をかけて進めるしかない。急がば回れということになる。"
    kind: opinion

  - id: p19
    claim: "モデルのクラスが膨らんだFat Model、つまり太り過ぎモデル、逆にモデルが薄くて処理が神クラス側にあるドメインモデル貧血症、DB設計でひとつの表に何でも入れる神テーブルなどが、近い種類のアンチパターンとして並ぶ。"
    kind: fact

  - id: p20
    claim: "マイクロサービスの文脈で知られるストラングラーパターン、別名ストラングラーアプリケーションも、ひとつのサービスの内側でクラスを整え直す作業に使えそうで、スプラウトクラスやラップクラスを大掛かりにしたものと言えるかもしれない。あわせて読みたい本として『モノリスからマイクロサービスへ』も挙げられている。"
    kind: opinion
