source: texts/train/05-zenn-f38e88375cde86.md
title: "WANTEDLY ENGINEERING HANDBOOKを読んだ"
reader: "技術組織の採用や受け入れに関わる人、社内向けの手引き文書を作ろうとしている人"
thesis: "一定の規模をもつ技術組織なら、開発の作法や考え方をまとめた手引きを作り外にも出すことには十分な見返りがある。ただしその値打ちは作った時点では決まらず、どれだけ更新し続けられるかで決まる。"
points:
  - id: p11
    claim: "組版の細部では、強調に明朝体を使っているのが引っかかった。ゴシック体を当てる方がよい。"
    kind: opinion

  - id: p2
    claim: "それなりの規模と年数を重ねたシステムでは、この種の情報が一か所に揃っていること自体が、後から加わる人にとって数ヶ月あるいはそれ以上の短縮になりそう。裏を返せば、無ければその期間が丸ごと無駄になる。"
    kind: opinion
    scope: "規模も年数もある程度あるシステム"

  - id: p1
    claim: "Web版（docs.wantedly.dev）の紙版をWantedlyからだいぶ前に贈られ、コーヒー豆も一緒だったのでCOIを開示したうえで、礼の代わりに感想を書いたという経緯。"
    kind: fact

  - id: p9
    claim: "全体としてうまく回っている部分に光が当たっていて、困りごとや課題感の記述は薄いと感じた。とはいえ外へ出す文章に書きにくいのは当然で、社内では別のやり方で扱われているのだろう。"
    kind: opinion

  - id: p4
    claim: "最後を、話を聞きに来てほしい・もっと知りたい人はこちら、という次の一歩への案内で閉じているのが良い。"
    kind: opinion

  - id: p12
    claim: "この手の文書がそれなりに広まるとよい。他社のものがあれば読んでみたい。"
    kind: opinion

  - id: p6
    claim: "ばらばらの分野のものが一冊に収まっているので、日頃は直接触らない仕事の見通しを得るのにも効きそう。"
    kind: opinion

  - id: p3
    claim: "中身を社外にまで開くのは大きな決断。書き手に緊張感が生まれるし、執筆を業務として扱うことで品質と工数の裏づけにもなりそう。"
    kind: opinion

  - id: p8
    claim: "もっと深く聞きたくなった箇所もあった。具体的には「ソフトウェアデザインの基礎」のあたり。ただ前述のSlackチャンネルへの誘導があるのでそれで足りるのかもしれないし、分量の制約もあって難しいのだろう。真面目にやると『Googleのソフトウェアエンジニアリング』のような大著になってしまう。"
    kind: opinion

  - id: p13
    claim: "採用から受け入れまでを支える道具として、一定以上の規模の技術系企業なら何かしら真似してみるとよいのでは。"
    kind: opinion
    scope: "技術系で規模がある程度大きい企業"

  - id: p5
    claim: "採用施策の一部という性格もあるだろうが、実際に入ってもらった後の受け入れにも効く便利なものと言える。"
    kind: opinion

  - id: p7
    claim: "それでいて分量が程よく抑えられている。冊子にするという縛り（厚いと作るのも置くのも直すのも費用がかかるので薄くしたくなる）が働いた結果でもありそうで、他の資料とうまく結びつけられるなら強みになる。"
    kind: opinion

  - id: p10
    claim: "今後この文書をどれだけの手数と品質で保てるかが肝心。この水準で常に最新に追いつけているなら相当に便利だが、思ったより手間のかかる仕事。"
    kind: opinion
