source: texts/train/17-qiita-7500f1edf01705.md
title: "Wikidataで都道府県知事・市区村長を検索するためのSPARQL"
reader: "Wikidataから日本の首長の情報を取りたい人。SPARQLの基本的な書き方は知っている前提"
thesis: "Wikidataの首長データは指定の仕方がばらばらなので、上位クラスをたどる、修飾子で現職に絞る、UNIONで複数の書き方を束ねるという工夫を積まないと実用になる一覧は得られない。"
points:
  - id: p9
    claim: "条件の絞り込みはFILTERで行う。FILTER NOT EXISTS という書き方をすると、ブレースの中に並べた条件が成り立たない項目だけが結果に残る。終了日が未入力のものを選ぶのに、この性質を利用している。"
    kind: code

  - id: p3
    claim: "個別のエンティティで指定されている場合に備えるには、いったん上位のクラスを経由する形にクエリを組み替えるとよい。東京都知事(Q11525354)や北海道知事(Q33134383)は、上位クラス(P279)というプロパティによって都道府県知事(Q1623534)とつながっているので、そこを足がかりにできる。"
    kind: code

  - id: p14
    claim: "著者は、特別扱いが要るのは京都市だけらしいので、クエリを凝るより京都市の側のデータを直した方が早いのではないかと書いている。"
    kind: opinion

  - id: p1
    claim: "記事で紹介されるクエリは、Wikidataのクエリサービス(query.wikidata.org)に打ち込んで使うことを前提にしている。あわせて、データモデルに手を入れたためクエリと解説を書き直した、という注記が記事の冒頭に付いている。"
    kind: fact

  - id: p7
    claim: "現職だけを取り出したいなら、知事を辞めた日付が未入力のものだけを選べばよい。そのために修飾子を持ち出し、終了日(P582)の値が存在しない項目を一覧する形のクエリを書く。"
    kind: code

  - id: p11
    claim: "市区町村の側では首長(Q30185)が用いられている例がある。ただしこの項目は日本の外でも使われるため、素直に引くと海外の情報が大量に混ざってしまう。そこでP17(country, 国)を条件に加えて日本のものだけを抽出する。"
    kind: fact

  - id: p5
    claim: "都道府県の順に並べたくなった場合は、さらに別の項目を取る必要がある。記事が採った方針は、ISO 3166-2 を基準に並べることで、そのためにISO 3166-2コード(P300)というプロパティから値を引いている。"
    kind: code

  - id: p13
    claim: "その対応を入れたクエリは、UNIONを二重にした箇所が二つもできるのでだいぶすごい見た目になるが、これでいけそうだと著者は述べている。"
    kind: opinion

  - id: p2
    claim: "出発点になる最も基本的なクエリは、都道府県知事(Q1623534)で指定された人物を引いてくるもの。ただしこれだけでは、どの都道府県の知事なのかが結果に現れないという弱点がある。"
    kind: code

  - id: p15
    claim: "データモデルやスキーマをどう定めて情報を積み上げていくのかは、今後に残された大きな課題だと著者は見ている。"
    kind: opinion

  - id: p6
    claim: "都道府県を表示させると、同じ県について知事が複数並んでいることに気づく。これは歴代の知事がすべて出てきているせい。"
    kind: fact

  - id: p10
    claim: "修飾子を書くときは、p / ps / pq という3種のprefixを併用して指定する。"
    kind: fact

  - id: p4
    claim: "知事の項目から都道府県そのものを適切に取り出すには、その項目に対して管轄・適用区域 (P1001)というプロパティを見て、そこに入っている値を引けばよい。"
    kind: code

  - id: p8
    claim: "修飾子(qualifier)は、ある組み合わせの上にもう一組のプロパティと値をくっつけて、より詳しい情報を与えるための仕組みである。"
    kind: fact

  - id: p12
    claim: "市区町村長の記述はさらに揺れていて、首長(Q30185)を使わずに、（日本の）市長(Q19961107)をプロパティに当てている例や、京都市長(Q27826875)のような個別のものを当てている例がある。記事にはそれらを拾うクエリも載っている。"
    kind: fact

  - id: p16
    claim: "市区町村側のクエリでも知事のときと同じように、以下についての(P642)と管轄・適用区域(P1001)の二つをUNIONで束ねて扱っている。"
    kind: code
