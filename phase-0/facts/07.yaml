source: texts/train/07-zenn-d34b1a3b244e46.md
title: "2021年の「オブジェクト指向」を考える"
reader: "OOPという言葉を見聞きして正体をつかみきれていない開発者。特定の言語経験は問わない"
thesis: "この言葉が指すものは人によってまるで違い、上から定義を据えてそれに従えば良いコードが書けるという話でもない。ただし影響下にある言語を使う限り関連する語彙からは逃れられないので、定義に悩むのはやめて、言語を触りながら身につけるのが現実的。"
points:
  - id: p11
    claim: "「遅延束縛」は日本語だとピンとこないが、英語では Late Binding 、あるいは Dynamic Binding 、すなわち動的な束縛と呼ばれるもの。ここでの束縛は代入の親戚ではなく、書かれたメソッド名と実際の実装の結びつけを翻訳時ではなく走らせる時点で決めること。実利としては、後から派生クラスを足すときに元のコードを直したり作り直したりせずに済む点がある。動的な言語に慣れた人には伝わりにくいうえ、この系列の言語に限った機能でもない。"
    kind: fact

  - id: p4
    claim: "何を指しているかの候補として、継承の仕組みがあること、クラスを使って書くこと、データと手続きを一つにまとめること、それ用と呼ばれる言語を使うこと、オブジェクト同士でメッセージを送り合うこと、などが挙がる。"
    kind: example

  - id: p16
    claim: "定義を上から持ってきてそれに沿えば良いプログラムが書ける、ということは幸か不幸かなさそうで、一時期あったそういう傾向も今は消えている。一方でこの系列の言語を使う限りメソッドや継承・委譲といった語は避けられず、背景をいくらか知らないままだと妙なコードになりかねない。だから言語を動かし、コードを打ちながら身につける習得の仕方を勧めたい。"
    kind: opinion

  - id: p7
    claim: "筆者はデータと手続きをまとめることと情報を隠すことを別物として習った流儀なので、前者はあくまで「まとめるだけ」という立場。利点は、分かりやすくて扱いが楽になる程度に受け取っておけば最初は十分で、細かく言えばスコープの管理の話にもつながる。"
    kind: opinion

  - id: p1
    claim: "記事はきしだなおきのブログ記事に触発されて書かれたもの。筆者の立ち位置は、この考え方にはそれなりに好意的だが、時代の最先端でも開発に必須の知識でもない、という程度の温度。知っておくと便利で知らないと不便な場面もあるので、わざわざ避けるのは勧めない。"
    kind: opinion

  - id: p14
    claim: "デザインパターンやアーキテクチャパターン、さらにTDDやアジャイルまで持ち出す人もいる。パターンが賑やかだった時期とOOPが流行した時期が重なっており、パターンを考案したり書き表したりする際に暗黙の前提に置かれていたことも少なくなさそう。xUnit系のテストも同じ時期に一緒に育ち、SmalltalkやJavaで使われ始めたので並べて語られやすい。本質的な関係はないにせよ、結果として重なりがち。なお関数型でDDDをやる『Domain Modeling Made Functional』という本もある（筆者は未読）。"
    kind: opinion

  - id: p2
    claim: "この語はそもそも座りが悪い。意味がはっきりするのは、プログラミング・言語・設計・分析のように後ろに何かが付いた形の方で、裸の語はそれらをふわっと束ねたものに見える。"
    kind: opinion

  - id: p18
    claim: "いまの要件定義や設計の方面には、チーム作りに力を入れ、テストを書きつつリリースの間隔を詰めて監視と計測をすれば何とかなる、という身も蓋もない方法論しか残っていないようにも見える。形式手法は育ってきたが向きが違うし、広い範囲で使われてもいない。過去の文脈が顧みられないせいで語の指す範囲は余計にぶれ、昔の文献を辿ってもしっくりこない状態になっている。"
    kind: opinion

  - id: p9
    claim: "この分野にはメッセージを重く見る流れと、抽象データ型に根を持つ流れとがある。メッセージの話は Actor モデルにも関わるが、関係はあっても一括りにはできない距離感。"
    kind: fact

  - id: p12
    claim: "変数の後にドットを打つとメソッドの候補が出るのが利点だという説明も聞くが、これは重要な概念ではなく、呼び出しの書き方から派生した副次的な便利さと見るべき。"
    kind: opinion

  - id: p5
    claim: "ほかにも、データがアイデンティティーを持つこと、遅延束縛、ポリモーフィズム（多態性・多相性）、foo(val1, val2) ではなく val1.foo(val2) のように第一引数を関数名の前に書く構文、エディタの補完、UMLを書くこと、といったものが候補に並ぶ。構文の話には CLOS は？ という突っ込みがお約束で付くが、GoやRustもこの書き方を取り入れており一定の重みはありそう。"
    kind: example

  - id: p15
    claim: "関係が薄いものまで混ざるのは、一時期の開発の中でこの考え方が大きな場所を占め、開発に関わるあれこれが考え方や文化の面で影響を受けたことに由来するのだろう。直接の関係がなくても間接的な影響はあった、ということ。だからソフトウェア工学をまるごと学ぶうえでも、この分野の知見があると見通しがよくなる面はある。関数型についても同じことが言える。"
    kind: opinion

  - id: p3
    claim: "2020年代だと手法としての分析や設計はさほど活発でなさそうなので、実質はプログラミングとその周辺を漠然と指す語になっている。筆者としてはもう少し活気づいてほしいと感じている。"
    kind: opinion
    scope: "2020年代の状況として"

  - id: p6
    claim: "継承は使いすぎると害も大きいため、実装側の継承とインターフェース側の継承を切り分けたり、文法の側で部分的な委譲を助けたりといった工夫が重ねられてきた。影響を受けた新しめの言語では、継承を備えないまま同等のことを実現している例が多い。"
    kind: fact

  - id: p17
    claim: "かつては、コードの外にある要件定義や設計一般にまでこの考え方を広げ、開発と運用を通して使える体系を作ろうという大風呂敷があったと理解している。だが統一されたのは記法であるUML程度で、風呂敷を広げるほど収拾がつかなくなり、ほぼ同じ頃に出てきた軽めのアジャイル寄りの手法の方が広まった。もっとも筆者はRUPのような大規模手法には詳しくないと断っており、この項目自体おまけの扱い。今はDDDにかろうじて名残があるが、ドメインの専門家をモデリングに継続して巻き込む営みは、ほぼ消えているのではないか。"
    kind: opinion

  - id: p10
    claim: "データが同一性を持つという説明は以前ほど聞かなくなった。DDDに馴染みがあれば、エンティティと値の違いと言えば通じる。すべてを値として表すこともできそうだが、同一性を備えた側で扱う方が見通しのよい対象もある、という世界観。その性質を持たせるのに専用の言語が要るわけではないが、言語側に機能があれば自然に活かせて便利。"
    kind: opinion

  - id: p8
    claim: "どの言語がそれに当たるかの線引きは一歩間違えると争いになるので踏み込みたくないが、言語で決めてよいのかという気持ちは残る。その種の言語でそれらしくない書き方は普通にできるし、そうでない言語でそれらしく書く例も山ほどある。"
    kind: opinion

  - id: p13
    claim: "UMLはこの分野との相性がよく、それ以外ではさほど登場しないが、ユースケース図や状態マシン図は無関係に使えるという人もいそう。クラス図を基準に据えるなら、クラスを書くかどうかという話と同じ意味合いになる。"
    kind: opinion
