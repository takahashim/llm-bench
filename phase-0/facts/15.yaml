source: texts/train/15-qiita-878a42aee1ef37.md
title: "『ゼロから作るDeep Learning❷』2.4 カウントベースの手法の改善　資料"
reader: "『ゼロから作るDeep Learning❷』を読み進めている人。行列の基礎知識があると読みやすい"
thesis: "単に数え上げた共起行列は高頻度語に引きずられ、語彙の数だけ次元が膨れ上がるので、PPMIで重みを付け直し、SVDで次元削減まで行って初めて使える分散表現になる。"
points:
  - id: p11
    claim: "次元削減の道具として本書はSVDを採る。主成分分析など別の手法もあるらしい。いずれにせよ、元の情報のうち本質にあたる部分を落とさずに済ませることが大事になる。"
    kind: fact

  - id: p3
    claim: "the のような語はもともと出番が多いので、何と並んでも共起しやすい。むしろ出現回数が少ないのに一緒に現れる組の方が重みを持つのではないか、という発想になる。"
    kind: fact

  - id: p17
    claim: "distributional representation を分布表現、distributed representation を分散表現と呼び分ける流儀もあるようだ。分布仮説に立つ高次元で疎なものが前者で本書の第2章、低次元で密なものが後者で第3章にあたる。"
    kind: fact

  - id: p7
    claim: "ppmi() の実装では、小さな値 eps を足しておくことで log2(0) になるのを防いでいる。"
    kind: code

  - id: p14
    claim: "Σ は左上から右下へ値が大きい順に並ぶので、下の方を0にしてやれば次元が減る。著者はこの便利さのためにSVDを使っているのだと理解している。値が小さいところを消すので影響も小さいらしい。"
    kind: opinion

  - id: p1
    claim: "共起行列を作ったのはそもそも単語の分散表現を得るためで、その意味では共起行列自体がすでに単語のある種の分散表現と言える。ただしそのままでは出来が悪いので改良する。"
    kind: fact

  - id: p9
    claim: "この方法だと語彙が増えればそのまま次元も増える。10万語なら10万次元という話になってしまう。"
    kind: fact

  - id: p5
    claim: "日本語版Wikipediaにある「相互情報量」の項目は情報理論側の用語を指していて意味が微妙にずれるため注意が要る。この分野では自己相互情報量を単に相互情報量と称するらしく、PMIと呼んでおけば済むのではないかと著者は書いている。"
    kind: opinion

  - id: p13
    claim: "Σ は対角成分のみが大きい順に並び、他は0になる。むしろそう並ぶように U と V を決めるのだと捉えるとよい。与えられた C に対して Σ は一通りに決まるが、U と V は一通りではないらしい。なお特異値をそれぞれ2乗して足した値は元の行列の全要素の2乗和と一致する。これにはフロベニウスノルムという名前が付いている。"
    kind: fact

  - id: p2
    claim: "単に数えるだけでは高頻度な単語をうまく扱えない。the, car, drive の3語で言えば、意味の上では car と drive の結びつきが強そうなのに、the と car の方が強く出てしまう。"
    kind: example

  - id: p16
    claim: "本書が使うPTBのコーパスは、タグも構文解析木も削ぎ落とした素のテキストになっていて、著者はTreeとは一体何なのかと戸惑っている。配布元が無くなっているので、NLTK Corpora から落とせるものが本当にオリジナルかどうかも分からない。"
    kind: opinion

  - id: p6
    claim: "2つの語が共起しない場合は P(x,y) が0になり、log2(0) が負の無限大になって困る。そこで負の側を切り捨てた正の相互情報量、つまりPositive PMI(PPMI)を使う。"
    kind: fact

  - id: p10
    claim: "次元が多すぎると計算資源の面でうれしくないし、0ばかりの疎な行列は無駄が大きく、本質的には近いものが別の次元に割り振られてしまう。"
    kind: fact

  - id: p4
    claim: "この偏りを織り込む指標として Pointwise Mutual Information (相互情報量)を持ち出す。訳語には自己相互情報量と点相互情報量の両方が流通している。"
    kind: fact

  - id: p8
    claim: "著者は本書の式2.6について、total が100を下回る状況で Verbose=true にすると実行が落ちるのではないかと疑問を投げている。"
    kind: opinion

  - id: p12
    claim: "SVDでは、M×Nの行列 C を C = UΣV^T の3つの積に分解する。U は M×M、V は N×N の正方行列で、どちらも直交行列、つまり転置行列と逆行列が一致する行列になる(積は単位行列)。直感的には、回転や反転にあたる、長さを保つ変換だと思えばよい。"
    kind: fact

  - id: p15
    claim: "計算はPythonで行い、numpy が持つ linalg.svd を呼ぶ。速度を稼ぐ手法として Truncated SVD もあり、PTBでの評価のほうでは sklearn の randomized_svd を用いている。"
    kind: code

  - id: p18
    claim: "腰を入れて扱うデータとして Penn Treebank(PTB)が登場する。Treebank はコーパスの一種で、構文や意味の注記が付与されたものを指し、名前の由来は種子銀行や血液銀行からの類推だそうだ。コーパス自体は、言語学や自然言語処理で用いる大規模かつ構造を持ったテキストの集まりを言う。"
    kind: fact
