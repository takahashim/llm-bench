source: texts/train/19-qiita-83706685ba1721.md
title: "aozora2htmlのご紹介"
reader: "青空文庫のテキストを扱いたいRubyユーザー。gemの導入とコマンドライン操作ができる程度の前提"
thesis: "青空文庫の記法を扱う古いスクリプトを、手入れを続けられる今風のgemに作り直したのがaozora2htmlであり、変換の入口も増やしてあるので使って気づいた点を知らせてほしい。"
points:
  - id: p6
    claim: "開発の初期はlib/t2hs.rbには必要最小限しか触らず、その外側に足していく進め方だった。txt2html側が今どうなっているのか把握できていなかったからである。"
    kind: fact

  - id: p12
    claim: "引数にはURLも渡せる。その場合はまず取ってきて、それから変換する。"
    kind: fact

  - id: p1
    claim: "出発点は青空文庫で配られていたt2hs.rbで、これをgemに仕立てて拡張したのが現在のaozora2htmlにあたる。元のスクリプトはtxt2htmlという道具に付属していた。"
    kind: fact

  - id: p14
    claim: "青空文庫の記法は日本語そのものが目印になっており（傍点や字下げの指示を全角の角括弧で囲む類）、その解析を正規表現で押し切っている。そのためUnicode化の手間が大きい。もっと賢い手があるのではとも思うが、踏ん切りがついたらencode(\"shift_jis\")を並べて乗り切るかもしれない。"
    kind: opinion

  - id: p4
    claim: "引き継いだ側から見たtxt2htmlの困りどころは、gemでないため導入が煩雑、クラスが全部1ファイルに同居していて追いにくい、ソースがShift_JIS、単体の道具として設計されているのでマークアップ変換のライブラリとしては組み込みにくい、Rubyが1.9だった時代の記述が残る、の5点。"
    kind: example

  - id: p9
    claim: "想定はRuby 2.0以上で、1.9.3でも一応動くはずとされている。"
    kind: fact
    scope: "記事執筆時点のバージョン"

  - id: p3
    claim: "txt2htmlは注記の記法ごとに別々のクラスを置くなど、それなりに凝った設計になっていた。"
    kind: fact

  - id: p16
    claim: "文字コードの問題に区切りがついたら 1.0 を出したいと考えている。"
    kind: opinion

  - id: p8
    claim: "gemとして公開済みなので、近年のRubyが入っていれば `gem install aozora2html` の一行で導入できる。"
    kind: code

  - id: p13
    claim: "JIS X 0208 に収まらずサイト側では画像にされている外字も、`--use-jisx0213` を付ければ数値文字参照のテキストとして出せる。中島敦『山月記』の「虢」「袁」「〻」が実例に挙がっている。JIS X 0213 でも足りない文字は、さらに `--use-unicode` を重ねれば画像を使わずに済む。"
    kind: fact

  - id: p7
    claim: "のちに青空文庫側へ確認したところ、世に出ている版が最終形で、その後は誰も手を付けていないと分かった。それ以降はlib/t2hs.rbも大きく書き換えている。"
    kind: fact

  - id: p10
    claim: "入力の青空文庫形式と出力先のHTMLを並べて渡すと、指定した名前でファイルが作られる。引数を1つに省いた場合は、結果がShift_JISのまま標準出力に出る（t2hs.rbにはなかった挙動）。"
    kind: code

  - id: p5
    claim: "今後も使われ続けるものだと考えると、更新を重ねられる形に整えたくなる。それが作業の動機になっている。"
    kind: opinion

  - id: p11
    claim: "zipを直に渡すこともできる。配布が圧縮された状態で行われているためで、中を開いて最初に見つかった*.txtを本文と判断する。手元でラブクラフト『ダゴン』を読む例が挙げられている。"
    kind: fact

  - id: p15
    claim: "執筆中に確かめてみたら、`--help` と `--version` のどちらも表示されない状態だった（後で直すとしている）。"
    kind: fact

  - id: p2
    claim: "解析の中心であるlib/t2hs.rbだけがShift_JISから抜け出せておらず、残る課題のうち最も大きいのはここ。他のファイルはすでに移行できている。"
    kind: fact
